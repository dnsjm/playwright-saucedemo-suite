name: Update Visual Snapshots

# Manually-triggered workflow to regenerate Linux baseline screenshots
# for the visual regression suite. Run this after intentional UI changes,
# or once on first repo setup to seed baselines.
#
# Trigger from: Actions tab → "Update Visual Snapshots" → Run workflow

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Which browser project to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Update snapshots
        run: |
          if [ "${{ inputs.project }}" = "all" ]; then
            npx playwright test tests/regression/visual.spec.ts --update-snapshots || true
          else
            npx playwright test tests/regression/visual.spec.ts --project=${{ inputs.project }} --update-snapshots || true
          fi

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/regression/**/*-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: update visual regression baselines via CI"
            git push
          fi
